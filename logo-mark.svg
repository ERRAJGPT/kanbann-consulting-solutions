<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Kanbann Consulting Solutions">
  <defs>
    <linearGradient id="kMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a72"/>
      <stop offset="0.5" stop-color="#2f6bd0"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="kSheen" cx="0.28" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Gradient tile -->
  <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#kMark)"/>
  <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#kSheen)"/>

  <!-- Monogram K: stem + two arms opening upward/forward (growth) -->
  <g fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 26 V74"/>
    <path d="M34 50 L63 26"/>
    <path d="M34 50 L66 74"/>
  </g>

  <!-- Signature amber dot (echoes the brand's period accent) -->
  <circle cx="73" cy="24" r="6" fill="#ffd572"/>
</svg>
